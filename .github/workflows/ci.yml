name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
          playwright install --with-deps chromium

      - name: Lint and types
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Tests
        run: pytest -q --ignore=tests/test_ui.py

      # SPEC §16: a QA tool that fails its own accessibility checks is indefensible. The
      # gate is `major` or worse, which is stricter than the phase 10 line asks for, and
      # stricter on purpose — the point is that it never fires, not that it rarely does.
      - name: Our own checks against our own UI
        run: make dogfood

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-artifacts
          path: |
            /tmp/pytest-of-*/pytest-*/dogfood*/
          retention-days: 7
          if-no-files-found: ignore
